<script>
  // ============ DATA ============
  const PHONE = '+306951089108';
  const PHONE_DISPLAY = '6951 089 108';
  const EMAIL = 'ydrokalergakis@gmail.com';
  const INSTAGRAM = 'https://instagram.com/ydro_kalergakis';
  const LOCATION = 'Ηράκλειο, Κρήτη';

  const services = [
    { icon: 'icon-hammer', title: 'Υδραυλικές Εγκαταστάσεις & Ανακαινίσεις', desc: 'Πλήρης μελέτη και υλοποίηση για νέες εγκαταστάσεις ή ανακαίνιση μπάνιου / κουζίνας.' },
    { icon: 'icon-waves', title: 'Αποφράξεις & Καθαρισμός Αποχετεύσεων', desc: 'Άμεσο ξεβούλωμα αγωγών και αποχετεύσεων με σύγχρονο εξοπλισμό.' },
    { icon: 'icon-flame', title: 'Τοποθέτηση & Service Θερμοσιφώνων / Ηλιακών', desc: 'Εγκατάσταση, συντήρηση και επισκευή θερμοσιφώνων και ηλιακών συστημάτων.' },
    { icon: 'icon-fan', title: 'Τοποθέτηση & Service Αντλιών Θερμότητας', desc: 'Εγκατάσταση, συντήρηση και χημικός καθαρισμός στην κεντρική θέρμανση.' }
  ];

  const gallery = [
    { src: 'images/gallery-solar-1.jpg', alt: 'Εγκατάσταση ηλιακού θερμοσίφωνα στο Ηράκλειο', caption: 'Εγκατάσταση Ηλιακού Θερμοσίφωνα' },
    { src: 'images/gallery-thermosifon-tank.jpg', alt: 'Υδραυλική σύνδεση δοχείου θέρμανσης νερού', caption: 'Σύνδεση Δοχείου Θέρμανσης' },
    { src: 'images/gallery-manifold.jpg', alt: 'Ολοκληρωμένη εγκατάσταση ηλιακού θερμοσίφωνα με θέα στη θάλασσα', caption: 'Ολοκληρωμένη Εγκατάσταση Ηλιακού' },
    { src: 'images/gallery-ac-unit.jpg', alt: 'Τοποθέτηση εξωτερικής μονάδας αντλίας θερμότητας', caption: 'Τοποθέτηση Αντλίας Θερμότητας' },
    { src: 'images/gallery-heatpump.jpg', alt: 'Εγκατάσταση μονάδας αντλίας θερμότητας', caption: 'Εγκατάσταση Αντλίας Θερμότητας' },
    { src: 'images/gallery-exterior-piping.jpg', alt: 'Εξωτερική εγκατάσταση σωληνώσεων σε πρόσοψη κτιρίου', caption: 'Εξωτερική Εγκατάσταση Σωληνώσεων' }
  ];

  const footerColumns = [
    {
      title: 'Ydrokalergakis.gr',
      logo: true,
      content: 'Επαγγελματίας Υδραυλικός με άμεση εξυπηρέτηση σε όλο το Ηράκλειο Κρήτης.'
    },
    {
      title: 'Επικοινωνία',
      items: [
        { icon: 'icon-phone', html: `<a href="tel:${PHONE}" class="hover:text-white">${PHONE_DISPLAY}</a>` },
        { icon: 'icon-mail', html: `<a href="mailto:${EMAIL}" class="hover:text-white">${EMAIL}</a>` },
        { icon: 'icon-instagram', html: `<a href="${INSTAGRAM}" target="_blank" rel="noopener" class="hover:text-white">@ydro_kalergakis</a>` },
        { icon: 'icon-map-pin', html: LOCATION }
      ]
    },
    {
      title: 'Ωράριο',
      items: [
        { icon: 'icon-clock', html: 'Ανοιχτά 24/7 — κάθε μέρα' }
      ]
    }
  ];

  // ============ RENDER FUNCTIONS ============
  function createServiceCard(s) {
    return `<div class="card-base">
      <div class="icon-circle"><svg class="w-7 h-7"><use href="#${s.icon}"></use></svg></div>
      <h3 class="font-bold text-gray-900 mb-2">${s.title}</h3>
      <p class="text-sm text-gray-500">${s.desc}</p>
    </div>`;
  }

  function createGalleryItem(g) {
    return `<div class="gallery-card">
      <img src="${g.src}" alt="${g.alt}" class="w-full h-48 sm:h-56 object-cover" width="600" height="400" loading="lazy">
      <div class="p-4"><h3 class="font-bold text-gray-900">${g.caption}</h3></div>
    </div>`;
  }

  function createFooterColumn(col) {
    let html = '<div>';
    if (col.logo) {
      html += `<div class="flex items-center justify-center sm:justify-start gap-2 mb-3">
        <img src="images/logo.png" alt="Ydrokalergakis.gr λογότυπο" class="w-9 h-9 object-contain">
        <h3 class="text-white font-bold">${col.title}</h3>
      </div>
      <p class="text-sm text-gray-400">${col.content}</p>`;
    } else {
      html += `<h3 class="text-white font-bold mb-3">${col.title}</h3>`;
      col.items.forEach(item => {
        html += `<p class="text-sm flex items-center justify-center sm:justify-start gap-2 mb-2">
          <svg class="w-4 h-4"><use href="#${item.icon}"></use></svg>
          ${item.html}
        </p>`;
      });
      html = html.replace(/mb-2"$/, '">'); // last item no margin
    }
    html += '</div>';
    return html;
  }

  // ============ INIT ============
  document.getElementById('services-grid').innerHTML = services.map(createServiceCard).join('');
  document.getElementById('gallery-grid').innerHTML = gallery.map(createGalleryItem).join('');
  document.getElementById('footer-grid').innerHTML = footerColumns.map(createFooterColumn).join('');
</script>

</body>
